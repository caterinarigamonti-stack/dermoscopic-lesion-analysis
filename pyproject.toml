[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lesion-segmentation"
version = "0.1.0"
description = "Dermoscopic lesion and attribute segmentation pipeline"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26",
  "Pillow>=10",
  "scipy>=1.12",
  "segmentation-models-pytorch==0.5.0",
  "torch",
  "torchvision",
  "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]
